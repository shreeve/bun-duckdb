name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin DuckDB version in one place — bump as we adopt newer releases.
env:
  DUCKDB_VERSION: v1.5.2

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            duckdb_asset: libduckdb-linux-amd64.zip
            shim_artifact: libduckdb-shim-linux-x64.so
          - label: linux-arm64
            os: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64.zip
            shim_artifact: libduckdb-shim-linux-arm64.so
          - label: darwin-x64
            os: macos-13
            duckdb_asset: libduckdb-osx-universal.zip
            shim_artifact: libduckdb-shim-darwin-x64.dylib
          - label: darwin-arm64
            os: macos-latest
            duckdb_asset: libduckdb-osx-universal.zip
            shim_artifact: libduckdb-shim-darwin-arm64.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install libduckdb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          sudo cp libduckdb/libduckdb.so /usr/local/lib/
          sudo cp libduckdb/duckdb.h     /usr/local/include/ || true
          sudo ldconfig
          ls -lh /usr/local/lib/libduckdb.so

      - name: Install libduckdb (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          sudo cp libduckdb/libduckdb.dylib /usr/local/lib/
          ls -lh /usr/local/lib/libduckdb.dylib

      - name: Build platform-tagged FFI shim
        run: |
          make -C lib TAGGED=1
          make -C lib print-platform
          ls -lh lib/${{ matrix.shim_artifact }}

      - name: Run tests
        run: bun test

      - name: Smoke examples
        run: |
          bun examples/basic.mjs
          bun examples/prepared.mjs
          bun examples/appender.mjs

      - name: Upload shim artifact (consumed by release.yml on tag pushes)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shim_artifact }}
          path: lib/${{ matrix.shim_artifact }}
          retention-days: 7
