name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin DuckDB version in one place — bump as we adopt newer releases.
env:
  DUCKDB_VERSION: v1.5.2

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # darwin-x64 is intentionally absent here. The Intel macos-13
        # runner pool on GitHub is small enough to queue jobs for hours.
        # We get x86_64 coverage instead via the cross-compile target
        # in release.yml (`make darwin-x64-from-arm64`), which lipo's
        # the official universal libduckdb on the Apple Silicon runner.
        # If the cross-compiled shim ever produces a runtime difference
        # vs. native Intel build, add a one-off macos-13 smoke job here.
        include:
          - label: linux-x64
            os: ubuntu-latest
            duckdb_asset: libduckdb-linux-amd64.zip
            shim_artifact: libduckdb-shim-linux-x64.so
          - label: linux-arm64
            os: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64.zip
            shim_artifact: libduckdb-shim-linux-arm64.so
          - label: darwin-arm64
            os: macos-latest
            duckdb_asset: libduckdb-osx-universal.zip
            shim_artifact: libduckdb-shim-darwin-arm64.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install libduckdb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          sudo cp libduckdb/libduckdb.so /usr/local/lib/
          sudo cp libduckdb/duckdb.h     /usr/local/include/ || true
          sudo ldconfig
          ls -lh /usr/local/lib/libduckdb.so

      - name: Install libduckdb (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          # /usr/local/lib doesn't exist on Apple Silicon runners (Homebrew
          # lives in /opt/homebrew there). Stage to whichever Homebrew prefix
          # exists, falling back to /usr/local. The driver's findDuckDBLibrary()
          # checks both paths, and lib/Makefile auto-detects /opt/homebrew.
          if [ -d /opt/homebrew ]; then
            BREW_PREFIX=/opt/homebrew
          else
            BREW_PREFIX=/usr/local
          fi
          sudo mkdir -p "$BREW_PREFIX/lib" "$BREW_PREFIX/include"
          sudo cp libduckdb/libduckdb.dylib "$BREW_PREFIX/lib/"
          sudo cp libduckdb/duckdb.h        "$BREW_PREFIX/include/" || true
          ls -lh "$BREW_PREFIX/lib/libduckdb.dylib"

      - name: Build platform-tagged FFI shim
        run: |
          make -C lib TAGGED=1
          make -C lib print-platform
          ls -lh lib/${{ matrix.shim_artifact }}

      - name: Run tests
        run: bun test

      - name: Smoke examples
        run: |
          bun examples/basic.mjs
          bun examples/prepared.mjs
          bun examples/appender.mjs
          bun examples/iterate.mjs
          bun examples/async.mjs

      - name: Upload shim artifact (consumed by release.yml on tag pushes)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shim_artifact }}
          path: lib/${{ matrix.shim_artifact }}
          retention-days: 7
