name: release

# Triggers on tag push (v0.2.1, v0.3.0, etc.). Builds the FFI shim per
# platform, bundles whichever shims actually got built into the package,
# and publishes to npm. Falls back to creating a GitHub release with the
# tarball as an asset if NPM_TOKEN is not configured.
#
# Job topology:
#
#   build-shim-required  (3-platform matrix: linux-x64, linux-arm64, darwin-arm64)
#                         ↓ blocks
#   build-shim-optional  (1-job: darwin-x64)         publish
#                         (parallel; never blocks)     ↓
#                                                    Pack + npm publish + GitHub release
#
# darwin-x64 lives in its own optional job because GitHub's macos-13
# (Intel) runner pool is small enough to queue jobs for hours. We don't
# want a wedged Intel runner to delay every release indefinitely. The
# publish step downloads ALL artifacts in flight at that moment — if
# darwin-x64 has finished by then, its shim ships in the tarball; if
# not, the tarball ships without it and Intel-Mac users fall back to
# `make -C lib` as documented in the README.

on:
  push:
    tags:
      - 'v*'

env:
  DUCKDB_VERSION: v1.5.2

jobs:
  # ============================================================
  # Required shims — must all succeed for publish to proceed
  # ============================================================
  build-shim-required:
    name: build-shim ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            duckdb_asset: libduckdb-linux-amd64.zip
            shim_artifact: libduckdb-shim-linux-x64.so
          - label: linux-arm64
            os: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64.zip
            shim_artifact: libduckdb-shim-linux-arm64.so
          - label: darwin-arm64
            os: macos-latest
            duckdb_asset: libduckdb-osx-universal.zip
            shim_artifact: libduckdb-shim-darwin-arm64.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Install libduckdb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          sudo cp libduckdb/libduckdb.so /usr/local/lib/
          sudo cp libduckdb/duckdb.h     /usr/local/include/ || true
          sudo ldconfig

      - name: Install libduckdb (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          if [ -d /opt/homebrew ]; then
            BREW_PREFIX=/opt/homebrew
          else
            BREW_PREFIX=/usr/local
          fi
          sudo mkdir -p "$BREW_PREFIX/lib" "$BREW_PREFIX/include"
          sudo cp libduckdb/libduckdb.dylib "$BREW_PREFIX/lib/"
          sudo cp libduckdb/duckdb.h        "$BREW_PREFIX/include/" || true

      - name: Build platform-tagged FFI shim
        run: make -C lib TAGGED=1

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shim_artifact }}
          path: lib/${{ matrix.shim_artifact }}
          retention-days: 1

  # ============================================================
  # Optional shim — runs in parallel; publish never waits on this
  # ============================================================
  build-shim-optional-darwin-x64:
    name: build-shim darwin-x64 (optional)
    runs-on: macos-13
    timeout-minutes: 60
    continue-on-error: true   # never fails the workflow regardless of outcome
    steps:
      - uses: actions/checkout@v4

      - name: Install libduckdb
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-osx-universal.zip"
          unzip -q libduckdb.zip -d libduckdb
          if [ -d /opt/homebrew ]; then
            BREW_PREFIX=/opt/homebrew
          else
            BREW_PREFIX=/usr/local
          fi
          sudo mkdir -p "$BREW_PREFIX/lib" "$BREW_PREFIX/include"
          sudo cp libduckdb/libduckdb.dylib "$BREW_PREFIX/lib/"
          sudo cp libduckdb/duckdb.h        "$BREW_PREFIX/include/" || true

      - name: Build platform-tagged FFI shim
        run: make -C lib TAGGED=1

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-shim-darwin-x64.dylib
          path: lib/libduckdb-shim-darwin-x64.dylib
          retention-days: 1

  # ============================================================
  # Publish — depends ONLY on required shims; uses optional if available
  # ============================================================
  publish:
    needs: build-shim-required
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub release
      id-token: write   # for npm provenance (optional but recommended)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download shim artifacts
        # Pulls every artifact uploaded so far across the run. If
        # build-shim-optional-darwin-x64 has finished by now its shim
        # is included; if not, the staging step ships without it.
        uses: actions/download-artifact@v4
        with:
          path: lib-shims

      - name: Stage shims into lib/
        # Required shims (linux-x64, linux-arm64, darwin-arm64) must all
        # be present — publish fails otherwise. The darwin-x64 shim is
        # best-effort.
        run: |
          set -uo pipefail   # NOT -e: optional-missing path must not fail

          stage() {
            local name=$1
            local required=$2
            local src="lib-shims/$name/$name"
            if [ -f "$src" ]; then
              cp "$src" lib/
              echo "  ✅ staged $name"
            elif [ "$required" = "required" ]; then
              echo "::error::Required shim $name was not produced."
              exit 1
            else
              echo "::warning::Optional shim $name not available — tarball will ship without it."
              echo "  ⚠ skipped $name (Intel-Mac users will need to \`make -C lib\`)"
            fi
          }

          stage libduckdb-shim-linux-x64.so       required
          stage libduckdb-shim-linux-arm64.so     required
          stage libduckdb-shim-darwin-arm64.dylib required
          stage libduckdb-shim-darwin-x64.dylib   optional

          echo
          echo "=== final lib/ contents ==="
          ls -lh lib/libduckdb-shim-* 2>&1 || echo "(none)"

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Pack tarball (for the GitHub release artifact)
        run: npm pack

      - name: Publish to npm (skipped if NPM_TOKEN secret is not set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npm publish."
            echo "Set NPM_TOKEN under repo Settings → Secrets → Actions to enable auto-publish."
            echo "The GitHub release with the tarball is still being created below."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
