name: release

# Triggers on tag push (v0.2.1, v0.3.0, etc.). Builds the FFI shim per
# platform, bundles whichever shims actually got built into the package,
# and publishes to npm. Falls back to creating a GitHub release with the
# tarball as an asset if NPM_TOKEN is not configured.
#
# Job topology:
#
#   build-shim-required  (5 shims from 4 runners)
#       linux-x64        → ubuntu-latest        → make TAGGED=1
#       linux-arm64      → ubuntu-24.04-arm     → make TAGGED=1
#       darwin-arm64     → macos-latest         → make TAGGED=1
#       darwin-x64       → macos-latest         → make darwin-x64-from-arm64
#                                                  (cross-compile via lipo + clang -arch x86_64)
#       win32-x64        → windows-latest       → lib/build.ps1 -Tagged
#                                                  (MSVC cl.exe via ilammy/msvc-dev-cmd)
#                          ↓ all required
#                       publish
#
# We deliberately avoid using GitHub's macos-13 (Intel) runner pool.
# It's small enough that jobs sit queued for hours, which historically
# blocked our publish step indefinitely. Instead, the macos-latest
# (Apple Silicon) runner produces BOTH macOS shims: the native arm64
# one and an x64 cross-compile via `make darwin-x64-from-arm64`. The
# cross-compile downloads DuckDB's universal libduckdb release, lipo's
# out the x86_64 slice, and links the shim with `clang -arch x86_64`.
# Result is a bit-for-bit equivalent dylib to one built natively on
# Intel — no Intel runner required.

on:
  push:
    tags:
      - 'v*'

env:
  DUCKDB_VERSION: v1.5.5

jobs:
  # ============================================================
  # Required shims — must all succeed for publish to proceed
  # ============================================================
  build-shim-required:
    name: build-shim ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            duckdb_asset: libduckdb-linux-amd64.zip
            shim_artifact: libduckdb-shim-linux-x64.so
          - label: linux-arm64
            os: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64.zip
            shim_artifact: libduckdb-shim-linux-arm64.so
          - label: darwin-arm64
            os: macos-latest
            duckdb_asset: libduckdb-osx-universal.zip
            shim_artifact: libduckdb-shim-darwin-arm64.dylib
          - label: win32-x64
            os: windows-latest
            duckdb_asset: libduckdb-windows-amd64.zip
            shim_artifact: libduckdb-shim-win32-x64.dll
    steps:
      - uses: actions/checkout@v4

      - name: Install libduckdb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          sudo cp libduckdb/libduckdb.so /usr/local/lib/
          sudo cp libduckdb/duckdb.h     /usr/local/include/ || true
          sudo ldconfig

      - name: Install libduckdb (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -q libduckdb.zip -d libduckdb
          if [ -d /opt/homebrew ]; then
            BREW_PREFIX=/opt/homebrew
          else
            BREW_PREFIX=/usr/local
          fi
          sudo mkdir -p "$BREW_PREFIX/lib" "$BREW_PREFIX/include"
          sudo cp libduckdb/libduckdb.dylib "$BREW_PREFIX/lib/"
          sudo cp libduckdb/duckdb.h        "$BREW_PREFIX/include/" || true

      - name: Install libduckdb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/duckdb/duckdb/releases/download/$env:DUCKDB_VERSION/${{ matrix.duckdb_asset }}"
          Invoke-WebRequest -Uri $url -OutFile libduckdb.zip
          Expand-Archive -Path libduckdb.zip -DestinationPath libduckdb
          $duckdbDir = (Resolve-Path libduckdb).Path
          "DUCKDB_DIR=$duckdbDir" | Add-Content -Path $env:GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build platform-tagged FFI shim (Unix)
        if: runner.os != 'Windows'
        run: make -C lib TAGGED=1

      - name: Build platform-tagged FFI shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\lib\build.ps1 -Tagged -DuckDbDir $env:DUCKDB_DIR

      - name: Cross-compile darwin-x64 shim (Apple Silicon only)
        # On the macos-latest runner, also produce the Intel-Mac shim
        # via cross-compilation. Sidesteps GitHub's Intel runner queue
        # entirely — see workflow header for rationale.
        if: matrix.label == 'darwin-arm64'
        run: |
          make -C lib darwin-x64-from-arm64 DUCKDB_VERSION=${DUCKDB_VERSION}
          file lib/libduckdb-shim-darwin-x64.dylib

      - name: Upload native shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shim_artifact }}
          path: lib/${{ matrix.shim_artifact }}
          retention-days: 1

      - name: Upload cross-compiled darwin-x64 shim artifact
        if: matrix.label == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-shim-darwin-x64.dylib
          path: lib/libduckdb-shim-darwin-x64.dylib
          retention-days: 1

  # ============================================================
  # Publish — bundles all 4 shims, publishes to npm, makes GH release
  # ============================================================
  publish:
    needs: build-shim-required
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub release
      id-token: write   # for npm provenance (optional but recommended)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download shim artifacts
        uses: actions/download-artifact@v4
        with:
          path: lib-shims

      - name: Stage shims into lib/
        # All 4 shims are now required — darwin-x64 comes from the
        # macos-latest runner via cross-compile, so we don't depend on
        # the Intel queue anymore.
        run: |
          set -euo pipefail

          stage() {
            local name=$1
            local src="lib-shims/$name/$name"
            if [ -f "$src" ]; then
              cp "$src" lib/
              echo "  ✅ staged $name"
            else
              echo "::error::Required shim $name was not produced."
              exit 1
            fi
          }

          stage libduckdb-shim-linux-x64.so
          stage libduckdb-shim-linux-arm64.so
          stage libduckdb-shim-darwin-arm64.dylib
          stage libduckdb-shim-darwin-x64.dylib
          stage libduckdb-shim-win32-x64.dll

          echo
          echo "=== final lib/ contents ==="
          ls -lh lib/libduckdb-shim-*
          echo
          echo "=== shim arch verification ==="
          file lib/libduckdb-shim-darwin-arm64.dylib
          file lib/libduckdb-shim-darwin-x64.dylib
          file lib/libduckdb-shim-win32-x64.dll

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Pack tarball (for the GitHub release artifact)
        run: npm pack

      - name: Publish to npm (skipped if NPM_TOKEN secret is not set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npm publish."
            echo "Set NPM_TOKEN under repo Settings → Secrets → Actions to enable auto-publish."
            echo "The GitHub release with the tarball is still being created below."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
